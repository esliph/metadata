name: Feature request
description: Propose a new capability or a change.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you cannot do today, and why it matters.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The API or behavior you want.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Other ways you considered to solve the problem.

  - type: dropdown
    id: parity
    attributes:
      label: Does it change an operation that `reflect-metadata` also has?
      options:
        - No, it is a new API
        - Yes
        - Not sure
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched the existing issues and the known limitations.
          required: true
